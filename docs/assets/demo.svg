<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 700" width="380" height="700" role="img" aria-label="LabSage 流式问答与断点续传演示">
  <title>LabSage · 演示动画（SVG）</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, Helvetica, Arial, sans-serif; }
    .h1 { font-size: 15px; font-weight: 700; fill: #0F172A; }
    .h2 { font-size: 10px; fill: #64748B; }
    .b { font-size: 13px; fill: #0F172A; }
    .w { font-size: 13px; fill: #FFFFFF; }
    .s { font-size: 11px; fill: #475569; }
    .s2 { font-size: 10px; fill: #94A3B8; }
    .chip { font-size: 11px; fill: #0F766E; }
    .chipok { font-size: 11px; fill: #15803D; }
    .err { font-size: 11px; fill: #B91C1C; }
    .btn { font-size: 11px; fill: #FFFFFF; font-weight: 600; }
    .cap { font-size: 10px; fill: #94A3B8; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="380" height="700" fill="#FFFFFF"/>

  <!-- 手机外框与屏幕 -->
  <rect x="10" y="10" width="360" height="680" rx="36" fill="#0F172A"/>
  <rect x="22" y="22" width="336" height="656" rx="28" fill="#F8FAFC"/>

  <!-- 顶栏 -->
  <circle cx="52" cy="52" r="14" fill="url(#brand)"/>
  <path d="M46 52 h12 M52 46 v12 M48 49 l8 8 M56 49 l-8 8" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <text class="t h1" x="74" y="50">LabSage</text>
  <text class="t h2" x="74" y="64">实验室 AI 知识助手</text>
  <line x1="22" y1="80" x2="358" y2="80" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 输入栏（静态） -->
  <rect x="36" y="622" width="262" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text class="t s2" x="56" y="645">输入问题…</text>
  <circle cx="334" cy="640" r="18" fill="url(#brand)"/>
  <path d="M327 640 h13 M334 634 v13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ========== 场景 1：流式问答 + 工具调用 ========== -->
  <!-- 用户气泡 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.022;0.033;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
    <rect x="120" y="100" width="216" height="40" rx="14" fill="#0F766E"/>
    <text class="t w" x="136" y="125">查一下现在 GPU 使用情况</text>
  </g>
  <!-- 头像 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.056;0.067;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
    <circle cx="46" cy="172" r="12" fill="url(#brand)"/>
    <path d="M41 172 h10 M46 167 v10 M43 169 l6 6 M49 169 l-6 6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 思考点 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.056;0.067;0.083;0.089;1" dur="18s" repeatCount="indefinite"/>
    <circle cx="70" cy="172" r="3.2" fill="#94A3B8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="172" r="3.2" fill="#94A3B8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="94" cy="172" r="3.2" fill="#94A3B8">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 工具 chip：调用中 → 完成 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.089;0.1;0.156;0.167;1" dur="18s" repeatCount="indefinite"/>
    <rect x="66" y="158" width="252" height="26" rx="13" fill="#CCFBF1" stroke="#0F766E" stroke-width="1"/>
    <circle cx="80" cy="171" r="4" fill="none" stroke="#0F766E" stroke-width="1.4"/>
    <path d="M80 168.5 a2.5 2.5 0 0 1 2.5 2.5" fill="none" stroke="#0F766E" stroke-width="1.4" stroke-linecap="round"/>
    <text class="t chip" x="92" y="175">调用 #1 query_nvidia_gpu_usage</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.156;0.167;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
    <rect x="66" y="158" width="252" height="26" rx="13" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
    <path d="M75 171 l3.5 3.5 6 -7" fill="none" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t chipok" x="92" y="175">调用完成 · 312 ms</text>
  </g>
  <!-- 回答气泡（高度随行数增长） -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.178;0.189;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
    <rect x="66" y="196" width="272" height="108" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1">
      <animate attributeName="height" calcMode="discrete" values="40;60;80;100;108" keyTimes="0;0.222;0.267;0.311;0.356" dur="18s" repeatCount="indefinite"/>
    </rect>
    <text class="t b" x="82" y="220" clip-path="url(#l1a)">当前 4 张 GPU 使用情况：</text>
    <text class="t b" x="82" y="240" clip-path="url(#l1b)">GPU0 78% · GPU1 65%</text>
    <text class="t b" x="82" y="260" clip-path="url(#l1c)">GPU2 12% · GPU3 0%（空闲）</text>
    <text class="t b" x="82" y="280" clip-path="url(#l1d)">建议把新任务调度到 GPU3。</text>
  </g>
  <!-- 状态行 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.367;0.378;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
    <text class="t s2" x="66" y="326">回答完成 · react 路由 · 工具调用 1 次</text>
  </g>
  <text class="t cap" x="190" y="604" text-anchor="middle">
    场景 1 · 流式问答 + 工具调用可视化
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.011;0.022;0.5;0.511;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- ========== 场景 2：断线 → 断点续传 ========== -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.522;0.533;0.989;0.995;1" dur="18s" repeatCount="indefinite"/>
    <rect x="120" y="100" width="216" height="40" rx="14" fill="#0F766E"/>
    <text class="t w" x="136" y="125">总结一下上周的实验记录</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.556;0.567;0.989;0.995;1" dur="18s" repeatCount="indefinite"/>
    <circle cx="46" cy="172" r="12" fill="url(#brand)"/>
    <path d="M41 172 h10 M46 167 v10 M43 169 l6 6 M49 169 l-6 6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <rect x="66" y="196" width="272" height="108" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1">
      <animate attributeName="height" calcMode="discrete" values="40;60;80;100;108" keyTimes="0;0.6;0.767;0.811;0.856" dur="18s" repeatCount="indefinite"/>
    </rect>
    <text class="t b" x="82" y="220" clip-path="url(#l2a)">上周共 3 组实验：</text>
    <text class="t b" x="82" y="240" clip-path="url(#l2b)">1) 掺杂浓度扫描 — 已完成</text>
    <text class="t b" x="82" y="260" clip-path="url(#l2c)">2) 退火温度对比 — 已完成</text>
    <text class="t b" x="82" y="280" clip-path="url(#l2d)">3) 光谱测量 — 进行中，待补数据</text>
  </g>
  <!-- 断线横幅 + 继续生成按钮 -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.656;0.667;0.75;0.767;1" dur="18s" repeatCount="indefinite"/>
    <rect x="66" y="268" width="272" height="60" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
    <text class="t err" x="82" y="290">连接中断 · 已保存部分回答</text>
    <text class="t s2" x="82" y="306">is_partial = 1 · 可继续生成</text>
    <rect x="236" y="280" width="88" height="26" rx="13" fill="#0F766E"/>
    <text class="t btn" x="280" y="297" text-anchor="middle">继续生成</text>
    <circle cx="280" cy="293" r="8" fill="none" stroke="#0F766E" stroke-width="1.5">
      <animate attributeName="r" values="8;8;24;24" keyTimes="0;0.733;0.756;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.733;0.735;0.756;1" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.867;0.878;0.989;0.995;1" dur="18s" repeatCount="indefinite"/>
    <text class="t s2" x="66" y="344">续传完成 · Continue + PartialAnswer</text>
  </g>
  <text class="t cap" x="190" y="604" text-anchor="middle">
    场景 2 · 断线后基于残缺正文继续生成
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.511;0.522;0.989;0.995;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- 逐行揭示的裁剪区 -->
  <clipPath id="l1a"><rect x="82" y="206" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.178;0.222;0.5;0.511;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l1b"><rect x="82" y="226" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.222;0.267;0.5;0.511;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l1c"><rect x="82" y="246" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.267;0.311;0.5;0.511;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l1d"><rect x="82" y="266" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.311;0.356;0.5;0.511;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l2a"><rect x="82" y="206" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.556;0.6;0.989;0.995;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l2b"><rect x="82" y="226" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.6;0.644;0.989;0.995;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l2c"><rect x="82" y="246" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.767;0.811;0.989;0.995;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="l2d"><rect x="82" y="266" height="18" width="0"><animate attributeName="width" values="0;0;246;246;0;0" keyTimes="0;0.811;0.856;0.989;0.995;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
</svg>
