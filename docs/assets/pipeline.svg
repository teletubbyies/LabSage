<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="LabSage 双时钟域流式架构">
  <title>LabSage · 双时钟域流式架构</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #16323D; letter-spacing: 0.5px; }
    .eyebrow { font-size: 10px; fill: #6A8291; letter-spacing: 4.5px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 700; fill: #16323D; }
    .hw { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #5B7480; }
    .monoC { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #9FB8C4; }
    .planeLbl { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #5B7480; letter-spacing: 2px; }
    .clk { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #0F9488; font-weight: 700; }
    .valveT { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #0F766E; }
    .num { font-size: 10px; font-weight: 700; fill: #FFFFFF; font-family: "SF Mono", Menlo, monospace; }
    .statBig { font-size: 44px; font-weight: 800; fill: url(#gradTeal); }
    .statSub { font-size: 12px; fill: #47566B; }
    .footer { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; fill: #8AA0AC; }
    .flow { fill: none; stroke: #16323D; stroke-width: 1.8; }
    .flowTeal { fill: none; stroke: url(#gradTeal); stroke-width: 2; }
    .dash { fill: none; stroke: #7C95A2; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .dashTeal { fill: none; stroke: #14B8A6; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .dashAmber { fill: none; stroke: #B45309; stroke-width: 1.6; stroke-dasharray: 7 4; }
    .module { fill: #FFFFFF; stroke: #16323D; stroke-width: 1.2; }
    .moduleTint { fill: #F6FBFA; stroke: #16323D; stroke-width: 1.2; }
    .moduleBlue { fill: #F4F8FB; stroke: #16323D; stroke-width: 1.2; }
    .plane { stroke: #B9CCD4; stroke-width: 1; stroke-dasharray: 3 6; }
    .port { fill: #FFFFFF; stroke: #16323D; stroke-width: 1.3; }
    .lblAmber { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #B45309; }
    .lblTeal { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #0F9488; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFCFD"/>
      <stop offset="100%" stop-color="#EBF1F3"/>
    </linearGradient>
    <linearGradient id="gradTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#E0EAED" stroke-width="0.7"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#16323D" flood-opacity="0.06"/>
    </filter>
    <marker id="mInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16323D"/>
    </marker>
    <marker id="mTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F9488"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <marker id="mGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C95A2"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- 图纸外框 + 角标 -->
  <rect x="22" y="22" width="1236" height="676" fill="none" stroke="#16323D" stroke-width="1.4"/>
  <path d="M22,42 v-20 h20 M1258,42 v-20 h-20 M22,676 v20 h20 M1258,676 v20 h-20" fill="none" stroke="#16323D" stroke-width="2.2"/>

  <!-- 标题 -->
  <text class="t eyebrow" x="56" y="62">LABSAGE · SYSTEM BLUEPRINT</text>
  <text class="t title" x="56" y="92">双时钟域流式架构</text>

  <!-- 平面边界 -->
  <line class="plane" x1="200" y1="140" x2="985" y2="140"/>
  <line class="plane" x1="200" y1="330" x2="985" y2="330"/>
  <line class="plane" x1="200" y1="410" x2="985" y2="410"/>
  <line class="plane" x1="200" y1="540" x2="985" y2="540"/>
  <text class="t planeLbl" x="200" y="132">STREAMING · 50 ms · 易失</text>
  <text class="t planeLbl" x="200" y="402">DURABILITY · 500 ms · 持久</text>

  <!-- 端点 -->
  <g filter="url(#soft)"><rect x="56" y="190" width="120" height="70" rx="8" fill="#16323D"/></g>
  <text class="t hw" x="76" y="221">Agent 服务</text>
  <text class="t monoC" x="76" y="241">Go · SSE</text>

  <g filter="url(#soft)"><rect x="1000" y="190" width="132" height="70" rx="8" fill="#16323D"/></g>
  <text class="t hw" x="1022" y="221">Compose</text>
  <text class="t monoC" x="1022" y="241">20 Hz</text>

  <!-- 上平面模块 -->
  <g filter="url(#soft)"><rect class="module" x="216" y="190" width="140" height="70" rx="10"/></g>
  <text class="t h" x="234" y="221">事件过滤</text>
  <text class="t mono" x="234" y="243" font-size="9.5">[tool][react][route]</text>

  <g filter="url(#soft)"><rect x="392" y="190" width="140" height="70" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/></g>
  <text class="t mono" x="410" y="212" font-size="10" fill="#92700C">有界缓冲</text>
  <text class="t" x="410" y="245" font-size="29" font-weight="800" fill="#B45309">512</text>
  <text class="t mono" x="410" y="258" font-size="9.5" fill="#92700C">溢出断连</text>

  <g filter="url(#soft)"><rect class="moduleTint" x="568" y="190" width="140" height="70" rx="10"/></g>
  <text class="t h" x="586" y="221">内存累积</text>
  <text class="t mono" x="586" y="243">StringBuilder</text>

  <g filter="url(#soft)"><rect class="moduleTint" x="760" y="190" width="140" height="70" rx="10"/></g>
  <text class="t h" x="778" y="221">快照发布</text>
  <text class="t mono" x="778" y="243">StateFlow</text>

  <!-- 双时钟阀 -->
  <g filter="url(#soft)"><rect x="548" y="346" width="180" height="48" rx="12" fill="#FFFFFF" stroke="url(#gradTeal)" stroke-width="1.8"/></g>
  <text class="t valveT" x="638" y="367" text-anchor="middle">SseUpdateCadence</text>
  <text class="t mono" x="638" y="384" text-anchor="middle" font-size="9.5" fill="#5B7480">单决策 · 双通道</text>

  <!-- 下平面模块 -->
  <g filter="url(#soft)"><rect class="moduleBlue" x="560" y="450" width="170" height="70" rx="10"/></g>
  <text class="t h" x="578" y="480">checkpoint</text>
  <text class="t mono" x="578" y="502">INSERT → UPDATE</text>

  <g filter="url(#soft)"><rect class="moduleBlue" x="800" y="450" width="170" height="70" rx="10"/></g>
  <text class="t h" x="818" y="480">终态 finalize</text>
  <text class="t mono" x="818" y="502">立即落盘</text>

  <g filter="url(#soft)"><rect class="moduleBlue" x="216" y="450" width="170" height="70" rx="10"/></g>
  <text class="t h" x="234" y="480">恢复 · 同步</text>
  <text class="t mono" x="234" y="502">is_partial=1 · Continue</text>

  <!-- 主数据流 -->
  <path class="flow" d="M176,225 L212,225" marker-end="url(#mInk)"/>
  <path class="flow" d="M356,225 L388,225" marker-end="url(#mInk)"/>
  <path class="flow" d="M532,225 L564,225" marker-end="url(#mInk)"/>
  <path class="flow" d="M708,225 L756,225" marker-end="url(#mInk)"/>
  <path class="flow" d="M900,225 L996,225" marker-end="url(#mInk)"/>
  <text class="t clk" x="732" y="216">50 ms</text>

  <!-- 累积 → 阀 → checkpoint -->
  <path class="flow" d="M638,260 L638,342" marker-end="url(#mInk)"/>
  <path class="flowTeal" d="M638,394 L638,446" marker-end="url(#mTeal)"/>
  <text class="t clk" x="648" y="426">500 ms</text>

  <!-- 终态旁路 -->
  <path class="dashAmber" d="M708,262 L818,262 Q830,262 830,274 L830,446" marker-end="url(#mAmber)"/>
  <text class="t lblAmber" x="842" y="358">终态直落</text>

  <!-- checkpoint → finalize -->
  <path class="flow" d="M730,485 L796,485" marker-end="url(#mInk)"/>

  <!-- 断点续传回环 -->
  <path class="dash" d="M216,485 L120,485 Q108,485 108,473 L108,274" marker-end="url(#mGray)"/>
  <text class="t mono" x="56" y="508" font-size="9.5">断点续传</text>

  <!-- 重启对账 -->
  <path class="dashTeal" d="M301,450 L301,336" marker-end="url(#mTeal)"/>
  <text class="t lblTeal" x="309" y="396">重启对账</text>

  <!-- 端口 -->
  <circle class="port" cx="176" cy="225" r="3.2"/>
  <circle class="port" cx="708" cy="225" r="3.2"/>
  <circle class="port" cx="900" cy="225" r="3.2"/>
  <circle class="port" cx="638" cy="260" r="3.2"/>
  <circle class="port" cx="638" cy="446" r="3.2"/>
  <circle class="port" cx="830" cy="446" r="3.2" stroke="#B45309"/>

  <!-- 编号 -->
  <g>
    <circle cx="216" cy="190" r="9" fill="#16323D"/><text class="t num" x="216" y="193.5" text-anchor="middle">1</text>
    <circle cx="392" cy="190" r="9" fill="#16323D"/><text class="t num" x="392" y="193.5" text-anchor="middle">2</text>
    <circle cx="568" cy="190" r="9" fill="#16323D"/><text class="t num" x="568" y="193.5" text-anchor="middle">3</text>
    <circle cx="760" cy="190" r="9" fill="#16323D"/><text class="t num" x="760" y="193.5" text-anchor="middle">4</text>
    <circle cx="560" cy="450" r="9" fill="#16323D"/><text class="t num" x="560" y="453.5" text-anchor="middle">5</text>
    <circle cx="800" cy="450" r="9" fill="#16323D"/><text class="t num" x="800" y="453.5" text-anchor="middle">6</text>
  </g>

  <!-- 实测 -->
  <text class="t statBig" x="1000" y="352">−82%…−97%</text>
  <text class="t statSub" x="1000" y="378">Room 写入 · 真实 trace 回放</text>

  <!-- 页脚 -->
  <text class="t footer" x="56" y="684">REV 2 · 2026-11-01 · SRC SseUpdateCadence</text>
</svg>
