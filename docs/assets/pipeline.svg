<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="LabSage SSE 流式回答链路（级联结构）">
  <title>LabSage · SSE 流式回答链路</title>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 14px; font-weight: 700; fill: #0F172A; }
    .mono { font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: 11px; fill: #0F766E; }
    .sm { font-size: 11px; fill: #64748B; }
    .lbl { font-size: 10px; fill: #0F766E; font-weight: 600; font-family: "SF Mono", Menlo, Consolas, monospace; }
    .num { font-size: 34px; font-weight: 800; fill: #B45309; }
    .stat { font-size: 44px; font-weight: 800; fill: #B45309; }
    .title { font-size: 13px; fill: #94A3B8; letter-spacing: 2px; }
    .flow { fill: none; stroke: #0F766E; stroke-width: 1.6; }
    .dash { fill: none; stroke: #94A3B8; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .icon { fill: none; stroke: #0F766E; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text class="t title" x="56" y="52">SSE 流式回答链路</text>

  <!-- 级联阶梯：事件逐级向下沉淀 -->
  <!-- S1 Agent -->
  <rect x="56" y="88" width="190" height="84" rx="12" fill="#FBFEFE" stroke="#0F766E" stroke-width="1.2"/>
  <path class="icon" d="M74 104 l6.5 -1 -2.8 5.5 5.5 -1 -8.2 12.5 1.8 -8 -4.5 1 3.6 -7 z"/>
  <text class="t h" x="74" y="140">Agent 服务</text>
  <text class="t mono" x="74" y="160">Go · SSE</text>

  <!-- S2 EventSource -->
  <rect x="278" y="158" width="190" height="84" rx="12" fill="#F5FDFB" stroke="#0F766E" stroke-width="1.2"/>
  <g class="icon" transform="translate(296,100)">
    <rect x="0" y="6" width="18" height="12" rx="2"/>
    <path d="M5 22 h8 M9 18 v4"/>
  </g>
  <text class="t h" x="296" y="210">EventSource</text>
  <text class="t mono" x="296" y="230">callbackFlow</text>

  <!-- S3 有界缓冲（焦点） -->
  <rect x="500" y="228" width="190" height="84" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/>
  <text class="t sm" x="518" y="256">有界缓冲</text>
  <text class="t num" x="518" y="292">512</text>
  <text class="t lbl" x="590" y="288">溢出 → 断连</text>

  <!-- S4 内存累积 -->
  <rect x="722" y="298" width="190" height="84" rx="12" fill="#EFFCF9" stroke="#0F766E" stroke-width="1.2"/>
  <g class="icon" transform="translate(740,240)">
    <rect x="0" y="4" width="18" height="5" rx="1.5"/>
    <rect x="0" y="12" width="18" height="5" rx="1.5"/>
    <rect x="0" y="20" width="18" height="5" rx="1.5"/>
  </g>
  <text class="t h" x="740" y="350">内存累积</text>
  <text class="t mono" x="740" y="370">StringBuilder</text>

  <!-- S5a UI -->
  <rect x="944" y="212" width="190" height="84" rx="12" fill="#E9FBF7" stroke="#0F766E" stroke-width="1.2"/>
  <g class="icon" transform="translate(962,224)">
    <rect x="0" y="2" width="20" height="13" rx="2"/>
    <path d="M6 20 h8 M10 15 v5"/>
  </g>
  <text class="t h" x="962" y="264">UI</text>
  <text class="t mono" x="962" y="284">Compose 重组</text>

  <!-- S5b Room -->
  <rect x="944" y="332" width="190" height="84" rx="12" fill="#E9FBF7" stroke="#0F766E" stroke-width="1.2"/>
  <g class="icon" transform="translate(962,344)">
    <ellipse cx="10" cy="4" rx="9" ry="3.5"/>
    <path d="M1 4 v11 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5 v-11"/>
    <path d="M1 9.5 c0 2 4 3.5 9 3.5 s9 -1.5 9 -3.5"/>
  </g>
  <text class="t h" x="962" y="384">Room</text>
  <text class="t mono" x="962" y="404">INSERT → UPDATE</text>

  <!-- 级联箭头 -->
  <path class="flow" d="M246,130 L274,192" marker-end="url(#ah)"/>
  <path class="flow" d="M468,200 L496,262" marker-end="url(#ah)"/>
  <path class="flow" d="M690,270 L718,332" marker-end="url(#ah)"/>
  <path class="flow" d="M912,330 L940,260" marker-end="url(#ah)"/>
  <path class="flow" d="M912,336 L940,368" marker-end="url(#ah)"/>
  <text class="t lbl" x="908" y="288" text-anchor="end">50 ms</text>
  <text class="t lbl" x="908" y="368" text-anchor="end">500 ms</text>

  <!-- 实测数据 -->
  <text class="t stat" x="722" y="460">−89.6%</text>
  <text class="t sm" x="722" y="482">Room 写入 202 → 21 次（模拟器实测）</text>

  <!-- 底座：Room 唯一数据源 -->
  <rect x="278" y="498" width="816" height="62" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.2"/>
  <text class="t h" x="306" y="536">Room · 唯一数据源</text>
  <text class="t sm" x="520" y="536" font-size="12" fill="#475569">重启读取 is_partial = 1 残缺正文 · 继续生成不重复落库</text>
  <path class="flow" d="M1039,416 L1039,494" marker-end="url(#ah)"/>

  <!-- 断点续传回环 -->
  <path class="dash" d="M278,529 C 160,529 138,360 149,180" marker-end="url(#ahg)"/>
  <text class="t sm" x="163" y="352">断点续传 ↺</text>

  <text class="t sm" x="56" y="618" font-size="10" fill="#94A3B8">依据：OkHttpSseDataSource.kt · ChatViewModel.kt · docs/SSE_CADENCE_GRID_REPORT.md</text>
</svg>
